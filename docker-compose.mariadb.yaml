services:
    app:
        build: .
        restart: unless-stopped
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            APP_URL: ${APP_URL:?Set APP_URL to the internal HTTP URL}
            APP_KEY: ${APP_KEY:?Set a persistent APP_KEY}
            LOG_CHANNEL: stderr
            SESSION_SECURE_COOKIE: 'false'
            DB_CONNECTION: mariadb
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-laravel}
            DB_USERNAME: ${DB_USERNAME:-laravel}
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
            MAIL_MAILER: smtp
            MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
            MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST}
            MAIL_PORT: ${MAIL_PORT:-587}
            MAIL_USERNAME: ${MAIL_USERNAME:-}
            MAIL_PASSWORD: ${MAIL_PASSWORD:-}
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?Set MAIL_FROM_ADDRESS}
            MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Laravel}
        volumes:
            - app-data:/var/www/html/storage/app
        networks:
            database:
            proxy:
                aliases:
                    - laravel-homelab
        depends_on:
            db:
                condition: service_healthy

    db:
        image: mariadb:11.8
        restart: unless-stopped
        environment:
            MARIADB_ROOT_HOST: localhost
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD}
            MARIADB_DATABASE: ${DB_DATABASE:-laravel}
            MARIADB_USER: ${DB_USERNAME:-laravel}
            MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
        volumes:
            - mariadb-data:/var/lib/mysql
        networks:
            - database
        healthcheck:
            test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
            interval: 5s
            timeout: 5s
            retries: 12

networks:
    database:
        internal: true
    proxy:
        external: true

volumes:
    app-data:
    mariadb-data:
