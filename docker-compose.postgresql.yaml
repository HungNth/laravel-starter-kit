services:
    app:
        build: .
        restart: unless-stopped
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            APP_URL: ${APP_URL:?Set APP_URL to the internal HTTP URL}
            APP_KEY: ${APP_KEY:?Set a persistent APP_KEY}
            LOG_CHANNEL: stderr
            SESSION_SECURE_COOKIE: 'false'
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: 5432
            DB_DATABASE: ${DB_DATABASE:-laravel}
            DB_USERNAME: ${DB_USERNAME:-laravel}
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
            MAIL_MAILER: smtp
            MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
            MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST}
            MAIL_PORT: ${MAIL_PORT:-587}
            MAIL_USERNAME: ${MAIL_USERNAME:-}
            MAIL_PASSWORD: ${MAIL_PASSWORD:-}
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?Set MAIL_FROM_ADDRESS}
            MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Laravel}
        volumes:
            - app-data:/var/www/html/storage/app
        networks:
            database:
            proxy:
                aliases:
                    - laravel-homelab
        depends_on:
            db:
                condition: service_healthy

    db:
        image: postgres:18
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-laravel}
            POSTGRES_USER: ${DB_USERNAME:-laravel}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
        volumes:
            - postgresql-data:/var/lib/postgresql
        networks:
            - database
        healthcheck:
            test:
                [
                    CMD-SHELL,
                    'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
                ]
            interval: 5s
            timeout: 5s
            retries: 12

networks:
    database:
        internal: true
    proxy:
        external: true

volumes:
    app-data:
    postgresql-data:
